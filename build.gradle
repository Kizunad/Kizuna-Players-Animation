plugins {
    alias(libs.plugins.fabric.loom)
    alias(libs.plugins.protobuf)
}

group = 'dev.kizuna'
version = '0.1.0-SNAPSHOT'

repositories { mavenCentral() }

dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    implementation libs.protobuf.java
    include libs.protobuf.java
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = libs.versions.java.get().toInteger()
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(libs.versions.java.get()) }
}

test { useJUnitPlatform() }

protobuf {
    // 编译器与运行库固定同版，调用方复用本仓唯一的协议源。
    protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.java.get()}" }
    generateProtoTasks {
        ofSourceSet('main').configureEach { task ->
            task.generateDescriptorSet = true
            task.descriptorSetOptions.path = layout.buildDirectory.file('descriptors/player-animation-v1.desc').get().asFile.path
            task.descriptorSetOptions.includeSourceInfo = true
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

jar { from('LICENSE') }

// 调用方只需协议源和描述符即可生成类型，不需要依赖 Minecraft 客户端。
tasks.register('protocolZip', Zip) {
    dependsOn tasks.named('generateProto')
    archiveClassifier = 'proto'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('src/main/proto')
    from(layout.buildDirectory.file('descriptors/player-animation-v1.desc')) { into 'descriptors' }
    from('LICENSE')
}

tasks.named('build') { dependsOn tasks.named('protocolZip') }

// 资源的唯一来源是 classic .bbmodel；测试前拒绝手写或漂移的导出 JSON。
tasks.register('checkAnimationAssets', Exec) {
    commandLine 'python3', 'scripts/export_bbmodel_animation.py', '--check'
}

tasks.register('checkAnimationGates', Exec) {
    commandLine 'python3', 'scripts/analyze_animation.py', 'walk', 'run', 'meditate',
            'jump', 'mine_main', 'mine_off', 'spyglass', 'spyglass_off',
            'crossbow_charge', 'crossbow_charge_off', 'crouch_work',
            'sneak', 'sneak_walk', 'eat', 'eat_off', 'drink', 'drink_off',
            'head_follow', 'head_follow_pitch', 'block_shield', 'block_shield_off',
            'bow_draw', 'bow_draw_off', 'trident_charge', 'trident_charge_off',
            'ride', 'sleep', 'elytra', 'climb', 'swim',
            'stance_idle', 'stance_enter', 'stance_exit', 'stance_walk_forward', 'stance_walk_back',
            'stance_walk_left', 'stance_walk_right', 'stance_run', 'dodge_forward', 'dodge_back',
            'dodge_left', 'dodge_right', 'technique_dash_forward', 'technique_dash_back',
            'technique_dash_left', 'technique_dash_right', 'block_one_hand', 'block_one_hand_hit',
            'block_two_hand', 'block_two_hand_hit', 'technique_breath', 'technique_charge',
            'door_breaker_knock', 'door_breaker_knock_off', 'door_breaker_cleave', 'door_breaker_cleave_off',
            'door_breaker_ram', 'door_breaker_ram_off', 'door_breaker_hook', 'door_breaker_hook_off',
            'door_breaker_sweep', 'door_breaker_sweep_off', 'door_breaker_close', 'door_breaker_close_off',
            'door_breaker_chain', 'door_breaker_chain_off', 'door_breaker_finale', 'door_breaker_finale_off',
            'door_breaker_guard', 'door_breaker_guard_off', 'technique_leap'
}

tasks.register('checkAnimationAntiForgery', Exec) {
    commandLine 'python3', 'scripts/test_animation_antiforgery.py'
}

tasks.named('check') {
    dependsOn tasks.named('checkAnimationAssets')
    dependsOn tasks.named('checkAnimationGates')
    dependsOn tasks.named('checkAnimationAntiForgery')
}

// 开发运行默认装入完整装配；-PkpaStandalone 只装本仓与 Fabric API，供其他仓的安装 JAR 与本仓版本不一致时单独验证。
boolean fullAssembly = !providers.gradleProperty('kpaStandalone').isPresent()
if (fullAssembly) {
    apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    clientTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    clientTestImplementation libs.junit.jupiter
    clientTestImplementation libs.junit.launcher
}

if (fullAssembly) {
    dependencies {
        // 高层仓只在运行时需要，按装配清单读文件，不把 Human 组合进本仓构建。
        clientTestRuntimeOnly files(kizunaWorkspace.artifact('human', 'client', false))
    }

    // 完整装配里其他模组依赖的纯 Java 库，测试运行显式装配。
    ['gametest', 'clientTest'].each { sourceSet ->
        dependencies.add("${sourceSet}RuntimeOnly", files(
                kizunaWorkspace.artifact('framework', 'server', false),
                kizunaWorkspace.artifact('humanoid-threatening', 'server', false)))
        dependencies.add("${sourceSet}RuntimeOnly", libs.tomlj)
    }
}

loom {
    mods {
        kizuna_players_animation { sourceSet sourceSets.main }
        kpa_gametest { sourceSet sourceSets.gametest }
        kpa_client_test { sourceSet sourceSets.clientTest }
    }
    runs {
        gametest {
            server()
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=../gametest-results.xml'
        }
        clientTest {
            client()
            source sourceSets.clientTest
            runDir 'build/clienttest'
            programArgs '--quickPlaySingleplayer', 'animation-test'
            vmArg '-Dkpa.clientTest.report=../clienttest-results.txt'
        }
    }
}

// 客户端复用本仓 GameTest 生成的世界，不依赖其他项目的测试存档。
tasks.register('prepareClientTestWorld', Copy) {
    dependsOn tasks.named('runGametest')
    from layout.buildDirectory.dir('gametest/world')
    into layout.buildDirectory.dir('clienttest/saves/animation-test')
    exclude 'session.lock'
}

tasks.named('runClientTest') {
    dependsOn tasks.named('prepareClientTestWorld')
    def report = layout.buildDirectory.file('clienttest-results.txt')
    def options = layout.buildDirectory.file('clienttest/options.txt')
    doFirst {
        report.get().asFile.text = 'success=false\n'
        // 26.2 首启先弹无障碍引导页再进快速游戏，测试目录预置为已看过引导。
        def file = options.get().asFile
        if (file.exists()) {
            file.text = file.text.replace('onboardAccessibility:true', 'onboardAccessibility:false')
        } else {
            file.parentFile.mkdirs()
            file.text = 'onboardAccessibility:false\n'
        }
    }
    doLast {
        if (report.get().asFile.readLines().first() != 'success=true') {
            throw new GradleException("客户端 JUnit 未全部通过，查看 ${report.get().asFile}")
        }
    }
}
